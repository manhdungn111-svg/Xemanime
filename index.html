<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flix Anime">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Flix Anime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230a7aff'/%3E%3Cstop offset='1' stop-color='%23002290'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Cpath d='M25 19l20 13-20 13z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --s1:#141518; --s2:#23252b; --line:#2a2c33;
  --t:#fff; --m:#a0a3ab;
  --b:#0a7aff; --b2:#0446c8; --b3:#002290;
  --grad:linear-gradient(135deg,#0a7aff,#002290);
  --nav:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--t);font-family:Lato,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{background:#0a0a0c}
body{background:#000}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}
/* Khung app cố định: chỉ vùng nội dung cuộn, thanh tab luôn đứng yên */
#app{position:fixed;top:0;left:0;right:0;bottom:calc(var(--gap,0px)*-1);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#view{max-width:980px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
body.nonav #view{padding-bottom:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.hide{display:none!important}
.av{border-radius:50%;object-fit:cover;background:var(--grad);display:grid;place-items:center;font-weight:900;color:#fff;flex:0 0 auto}
.prof{text-align:center;padding:22px 16px 6px}
.avwrap{position:relative;display:inline-block;margin:0 auto}
.avwrap .cam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--b);border:3px solid #000;display:grid;place-items:center;font-style:normal}
.prof h2{font-size:21px;font-weight:900;margin-top:12px}
.prof p{color:var(--m);font-size:13px;margin-top:4px}
.prow{display:flex;gap:10px;justify-content:center;margin-top:14px}
.prow .btn{height:40px;font-size:14px;min-width:120px}
.stats{display:flex;margin:18px 16px 0;background:var(--s1);border:1px solid var(--line);border-radius:12px}
.stats a{flex:1;text-align:center;padding:14px 0}
.stats a+a{border-left:1px solid var(--line)}
.stats b{display:block;font-size:22px;color:var(--b)}
.stats span{font-size:12.5px;color:var(--m)}
.auth{padding:18px 16px 40px;max-width:440px;margin:0 auto}
.auth label{display:block;font-size:13px;color:var(--m);font-weight:700;margin-bottom:14px}
.auth input,.sheet input[type=text]{display:block;width:100%;margin-top:6px;height:46px;border-radius:8px;border:1px solid var(--line);background:var(--s2);color:#fff;font:inherit;font-size:16px;padding:0 12px;outline:0}
.auth input:focus,.sheet input[type=text]:focus{border-color:var(--b)}
.auth .note{font-size:12.5px;color:var(--m);line-height:1.5;margin-bottom:16px;background:var(--s1);border-radius:8px;padding:10px 12px}
.auth .err{color:#ff6b6b;font-size:13px;min-height:18px;margin-bottom:8px}
.auth .alt{text-align:center;font-size:14px;color:var(--m);margin-top:18px}
.auth .alt a{color:var(--b);font-weight:700}
.rmv{margin-left:auto;color:var(--m)}
.list .i.danger{color:#ff6b6b}
.inst{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:12px}
.inst img{width:42px;height:42px;border-radius:10px}
.inst div{flex:1;font-size:13px;line-height:1.3}.inst b{display:block;font-size:14px}
.inst .btn{height:36px;padding:0 14px;font-size:13px}
.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet .in{width:100%;max-width:980px;margin:0 auto;background:#16171b;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet h3{font-size:18px;margin-bottom:12px}
.sheet ol{padding-left:20px;line-height:1.7;font-size:14.5px;color:#dcdee3;margin-bottom:18px}
.sheet .btn{width:100%}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(8px)}
.bar h1{font-size:16px;font-weight:700;flex:1;text-align:center}
.bar .sp{flex:1}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ib:active{background:var(--s2)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:.2px}
.logo i{width:30px;height:30px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 0 2px rgba(10,122,255,.25)}
.logo b{background:linear-gradient(90deg,#5aa8ff,#0a7aff);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px)}

/* hero */
.hero{position:relative;height:min(74vh,640px);min-height:440px;overflow:hidden;background:var(--s1)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center top;transition:opacity .5s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,.2) 48%,rgba(0,0,0,.92) 82%,#000 100%)}
.hero .top{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px}
.hero .info{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:0 16px 14px}
.hero h2{font-size:clamp(28px,7vw,46px);line-height:1.05;font-weight:900;text-shadow:0 2px 14px rgba(0,0,0,.8);margin-bottom:8px;max-width:780px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:#d5d7dc;margin-bottom:8px}
.meta .tag{border:1px solid #9aa;padding:0 5px;border-radius:3px;font-weight:700}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.45;color:#e8e9ec;max-width:780px}
.cta{display:flex;gap:10px;margin:14px 0 14px;max-width:780px}
.btn{height:46px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:15px;padding:0 18px}
.btn.pri{background:linear-gradient(90deg,#0a7aff,#0560e0);flex:1;box-shadow:0 4px 18px rgba(10,122,255,.35)}
.btn.pri:active{filter:brightness(.9)}
.btn.sq{width:46px;padding:0;border:2px solid var(--b);color:var(--b)}
.btn.sq.on{background:var(--b);color:#fff}
.btn.ghost{border:1px solid var(--line);background:var(--s1)}
.dots{display:flex;gap:6px;max-width:780px}
.dots button{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.28);position:relative;overflow:hidden}
.dots button.on::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fill 6s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* rows */
.row{margin:22px 0 4px}
.row h3{font-size:17px;font-weight:900;padding:0 16px 12px}
.scroller{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:42vw;max-width:178px;scroll-snap-align:start;display:block}
.pic{aspect-ratio:2/3;background:var(--s1);border-radius:3px;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .badge{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.72);padding:2px 6px;border-radius:3px}
.ct{font-size:13.5px;font-weight:700;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.cs{font-size:11.5px;color:var(--m);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 12px;padding:6px 16px}
.gr .card{width:auto;max-width:none}
.more{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px}

/* chips row */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--s2);font-size:13px;font-weight:700;white-space:nowrap}
.pill.on{background:var(--b)}

/* tabs */
.tabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:12px 0;font-size:13px;font-weight:700;color:var(--m);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-color:var(--b)}

/* list rows */
.lr{display:flex;gap:14px;padding:10px 16px;align-items:center}
.lr .th{width:112px;aspect-ratio:16/10;flex:0 0 auto;background:var(--s1);border-radius:3px;overflow:hidden;position:relative}
.lr .th img{width:100%;height:100%;object-fit:cover}
.lr.p .th{width:92px;aspect-ratio:3/4}
.lr .tx{min-width:0;flex:1}
.lr .tx b{display:block;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lr .tx span{display:block;font-size:12px;color:var(--m);margin-top:4px}
.playi{position:absolute;inset:0;display:grid;place-items:center}
.playi i{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid #fff;display:grid;place-items:center}

/* search */
.sbox{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:#000;z-index:20}
.sbox label{flex:1;display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:8px;padding:0 12px;height:42px}
.sbox input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px;min-width:0}
.sbox a{font-size:14px}

/* detail */
.dhead{position:relative;height:260px;background:var(--s1);overflow:hidden}
.dhead .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:saturate(1.05)}
.dhead::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,.25) 40%,#000 100%)}
.dhead .tp{position:absolute;z-index:2;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 10px}
.dtitle{position:relative;z-index:2;margin-top:-92px;padding:0 16px;text-align:center}
.dtitle h1{font-size:26px;font-weight:900;line-height:1.1;text-shadow:0 2px 12px #000}
.dtitle small{display:block;margin-top:6px;color:#cfd2d8;font-size:13px}
.dmeta{justify-content:center;margin-top:12px;padding:0 16px}
.acts{display:flex;justify-content:center;gap:36px;margin:12px 0}
.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--b);font-size:11px;font-weight:700}
.desc{padding:0 16px;font-size:13.5px;line-height:1.5;color:#dcdee3}
.desc.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.link{color:var(--b);font-size:12.5px;font-weight:700;padding:8px 16px;display:inline-block}
.sel{margin:12px 16px;background:var(--s2);color:#fff;border:0;border-radius:6px;padding:10px 12px;font:inherit;font-size:13px;font-weight:700;width:calc(100% - 32px)}
.stick{position:fixed;left:0;right:0;bottom:calc(var(--gap,0px)*-1);z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#000 70%,rgba(0,0,0,0));}
.stick .in{max-width:980px;margin:0 auto;display:flex;gap:10px}
.dpad{padding-bottom:90px}

/* watch */
.pbox{background:#000;aspect-ratio:16/10;max-height:56vh;width:100%;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top);box-sizing:content-box}
.pv{position:absolute;inset:0}
.pv video,.pv iframe{width:100%;height:100%;border:0;background:#000;display:block}
.ov{position:absolute;inset:0;pointer-events:none;transition:opacity .2s;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.25) 40%,rgba(0,0,0,.6))}
.ov:not(.show){opacity:0}
.ov:not(.show) *{pointer-events:none!important}
.ov button,.ov a,.ov input,.ov .menu{pointer-events:auto}
.emb .ov{background:none}
.emb .ov:not(.show){opacity:1}
.emb .vo{display:none!important}
.ot{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;align-items:center;gap:2px}
.ot .sp{flex:1}
.oc{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:15vw}
.oc button{display:grid;place-items:center;padding:6px}
.ob{position:absolute;left:0;right:0;bottom:0;padding:0 0 0}
.tm{display:flex;justify-content:space-between;font-size:13px;padding:0 14px 4px}
#sk{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;display:block;margin:0;--p:0%}
#sk::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--b) var(--p),rgba(255,255,255,.28) var(--p))}
#sk::-moz-range-track{height:4px;background:rgba(255,255,255,.28)}
#sk::-moz-range-progress{height:4px;background:var(--b)}
#sk::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--b);margin-top:-6px;border:0}
#sk::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--b);border:0}
.menu{position:absolute;right:10px;top:calc(56px + env(safe-area-inset-top));background:rgba(20,21,24,.97);border:1px solid var(--line);border-radius:10px;padding:10px;width:230px;z-index:5}
.menu .mh{font-size:12px;color:var(--m);font-weight:700;margin:4px 4px 8px}
.menu .pl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.menu .pill{padding:6px 12px;font-size:12.5px}
.wser{display:block;padding:18px 16px 0;color:var(--b);font-size:16px}
.wt{padding:8px 16px 0;font-size:23px;font-weight:900;line-height:1.2}
.wact{display:flex;align-items:center;gap:22px;padding:6px 16px}
.wact button,.wact a{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;min-height:44px}
.wact button.on{color:var(--b)}
.wact .sp{flex:1}
.hr{border:0;border-top:1px solid var(--line);margin:10px 0 0}
.ne{padding:18px 16px 8px;font-size:18px;color:#e6e7ea}
.orig{padding:6px 16px 0;font-size:12.5px;color:var(--m)}
.orig a{color:var(--b);font-weight:700}
.all{display:block;text-align:center;color:var(--b);font-weight:700;padding:22px}
.wtitle{padding:14px 16px 4px}
.wtitle small{color:var(--b);font-weight:700;font-size:12.5px}
.wtitle h2{font-size:19px;font-weight:900;margin-top:4px;line-height:1.2}
.epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;padding:6px 16px 16px}
.epgrid a{background:var(--s2);border-radius:6px;text-align:center;padding:10px 0;font-size:13px;font-weight:700}
.epgrid a.on{background:var(--b)}
.sec{padding:14px 16px 4px;font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:center}

/* empty / account */
.empty{text-align:center;padding:48px 28px}
.empty svg{margin:0 auto 18px}
.empty h3{font-size:18px;font-weight:900;margin-bottom:8px}
.empty p{color:var(--m);font-size:14px;margin-bottom:22px}
.empty .btn{width:100%;max-width:420px}
.empty-s{color:var(--m);font-size:14px;text-align:center;padding:20px}
.list a.i,.list button.i{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:15px 16px;border-bottom:1px solid var(--line);font-size:15px}
.list .i small{color:var(--m);font-size:12.5px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:18px auto 10px;font-size:34px;font-weight:900}
.seg{display:flex;margin:10px 16px;background:var(--s2);border-radius:8px;padding:3px}
.seg button{flex:1;padding:10px;border-radius:6px;font-weight:700;font-size:14px;color:var(--m)}
.seg button.on{background:var(--b);color:#fff}
.year{display:block;padding:17px 16px;font-size:16px}

/* nav */
#tabs{position:fixed;left:0;right:0;bottom:calc(var(--gap,0px)*-1);z-index:40;background:rgba(10,10,12,.96);backdrop-filter:blur(10px);border-top:1px solid #1d1f24;padding-bottom:env(safe-area-inset-bottom)}
#tabs::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:#0a0a0c}
#tabs .in{max-width:980px;margin:0 auto;display:flex;height:var(--nav)}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;color:#d9dbe0}
#tabs a.on{color:var(--b)}
body.nonav #tabs{display:none}

.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--b);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.load{display:grid;place-items:center;padding:80px 0}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%);background:#202228;border:1px solid var(--line);padding:11px 16px;border-radius:8px;font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
@media(min-width:760px){
  .card{width:170px}
  .hero{height:min(70vh,600px)}
  .gr{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 16px}
}
</style>
</head>
<body>
<div id="app"><div id="view"></div></div>
<nav id="tabs"><div class="in" id="tabin"></div></nav>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
/* ================= Cấu hình ================= */
const KK  = 'https://phimapi.com';          // KKPhim
const NC  = 'https://phim.nguonc.com';      // NguonC
const KKIMG = 'https://phimimg.com/';
const SRC_NAME = {kk:'KKPhim', nc:'NguonC'};
const TYPES = [['phim-bo','Phim bộ'],['phim-le','Phim lẻ'],['hoat-hinh','Hoạt hình'],['tv-shows','TV Shows']];
const GENRES = [
  ['hanh-dong','Hành động'],['tinh-cam','Tình cảm'],['hai-huoc','Hài hước'],['co-trang','Cổ trang'],
  ['tam-ly','Tâm lý'],['hinh-su','Hình sự'],['chien-tranh','Chiến tranh'],['the-thao','Thể thao'],
  ['vo-thuat','Võ thuật'],['vien-tuong','Viễn tưởng'],['phieu-luu','Phiêu lưu'],['khoa-hoc','Khoa học'],
  ['kinh-di','Kinh dị'],['am-nhac','Âm nhạc'],['than-thoai','Thần thoại'],['hoc-duong','Học đường']
];

/* ================= Tiện ích ================= */

async function hashPw(pw,saltB64){
  if(!(window.crypto&&crypto.subtle)) throw new Error('Trình duyệt không hỗ trợ mã hoá (cần https)');
  const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
  const salt=saltB64?Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0)):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256);
  return {salt:b64(salt),hash:b64(bits)};
}

async function jget(url){
  if(cache.has(url)) return cache.get(url);
  const c=new AbortController(), t=setTimeout(()=>c.abort(),15000);
  try{
    const r=await fetch(url,{signal:c.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json(); cache.set(url,j); return j;
  } finally {clearTimeout(t)}
}

/* ================= API (KKPhim + NguonC) ================= */
const API = {
  kk:{
    list({page=1,type,cat,year}={}){
      const q=`page=${page}&limit=24&sort_field=modified.time&sort_type=desc`;
      if(type){ let u=`${KK}/v1/api/danh-sach/${type}?${q}`; if(cat)u+=`&category=${cat}`; if(year)u+=`&year=${year}`; return jget(u); }
      if(cat)  return jget(`${KK}/v1/api/the-loai/${cat}?${q}${year?`&year=${year}`:''}`);
      if(year) return jget(`${KK}/v1/api/nam/${year}?${q}`);
      return jget(`${KK}/danh-sach/phim-moi-cap-nhat-v3?page=${page}`);
    },
    search:q=>jget(`${KK}/v1/api/tim-kiem?keyword=${encodeURIComponent(q)}&limit=24`),
    detail:s=>jget(`${KK}/phim/${encodeURIComponent(s)}`)
  },
  nc:{
    list({page=1,type,cat,year}={}){
      if(type) return jget(`${NC}/api/films/danh-sach/${type}?page=${page}`);
      if(cat)  return jget(`${NC}/api/films/the-loai/${cat}?page=${page}`);
      if(year) return jget(`${NC}/api/films/nam-phat-hanh/${year}?page=${page}`);
      return jget(`${NC}/api/films/phim-moi-cap-nhat?page=${page}`);
    },
    search:q=>jget(`${NC}/api/films/search?keyword=${encodeURIComponent(q)}`),
    detail:s=>jget(`${NC}/api/film/${encodeURIComponent(s)}`)
  }
};
const itemsOf = j => (j?.data?.items) || j?.items || j?.data?.movies || [];
const cdnOf = j => j?.data?.APP_DOMAIN_CDN_IMAGE || '';

function norm(it,s,cdn){
  const fix=u=>{ if(!u) return ''; if(/^(https?:)?\/\//.test(u)) return u; return (cdn?cdn.replace(/\/?$/,'/'):KKIMG)+String(u).replace(/^\//,'') };
  return {
    src:s, slug:it.slug, name:it.name||it.origin_name||'', origin:it.origin_name||it.original_name||'',
    thumb:fix(it.thumb_url||it.poster_url), poster:fix(it.poster_url||it.thumb_url),
    year:it.year||'', ep:it.episode_current||it.current_episode||'', lang:it.lang||it.language||'',
    quality:it.quality||'', desc:strip(it.description||it.content||''), type:it.type||''
  };
}
async function fetchList(opts){
  const s=src, j=await API[s].list(opts);
  const out=itemsOf(j).map(i=>norm(i,s,cdnOf(j))).filter(i=>i.slug);
  out.raw=out.length; return out;
}
async function fetchSearch(q){
  const s=src, j=await API[s].search(q);
  return itemsOf(j).map(i=>norm(i,s,cdnOf(j))).filter(i=>i.slug);
}
async function getDetail(slug,s){
  const j=await API[s].detail(slug);
  const m=j.movie||j.data?.item||null;
  if(!m) throw new Error('Không tìm thấy phim');
  let cats=[];
  if(s==='kk') cats=(m.category||[]).map(c=>c.name);
  else Object.values(m.category||{}).forEach(g=>{ if(/thể loại/i.test(g?.group?.name||'')) (g.list||[]).forEach(x=>cats.push(x.name)) });
  const allCats=s==='kk'?(m.category||[]).map(c=>c.name):Object.values(m.category||{}).flatMap(g=>(g.list||[]).map(x=>x.name));
  const eps=j.episodes||m.episodes||[];
  const servers=eps.map(sv=>({
    name:sv.server_name||'Server',
    eps:(sv.server_data||sv.items||[]).map(e=>({name:e.name,m3u8:e.link_m3u8||e.m3u8||'',embed:e.link_embed||e.embed||''}))
  })).filter(sv=>sv.eps.length);
  const base=norm(m,s);
  const actors=Array.isArray(m.actor)?m.actor.filter(Boolean).join(', '):(m.casts||'');
  return {...base, slug:base.slug||slug, cats, allCats, servers, time:m.time||'', status:m.status||'', actors,
    country:Array.isArray(m.country)?m.country.map(c=>c.name).join(', '):'', total:m.episode_total||m.total_episodes||''};
}

function grid(el,loader){
  let page=1,done=false,busy=false;
  el.innerHTML='<div class="gr"></div><div class="more"></div>';
  const g=$('.gr',el), m=$('.more',el);
  async function load(){
    if(busy||done) return; busy=true; m.innerHTML='<div class="spin"></div>';
    try{
      const items=await loader(page);
      if(!(items.raw??items.length)) done=true; else { g.insertAdjacentHTML('beforeend',items.map(card).join('')); page++; }
      m.innerHTML=done?'':'<button class="btn ghost" id="mb">Xem thêm</button>';
      if(!g.children.length) m.innerHTML='<p class="empty-s">Không có kết quả</p>';
    }catch(e){ m.innerHTML='<p class="empty-s">Không tải được dữ liệu ('+esc(e.message)+')</p><button class="btn ghost" id="mb">Thử lại</button>'; }
    busy=false; const b=$('#mb',m); if(b) b.onclick=load;
  }
  load();
}

  hero.insertAdjacentHTML('beforeend','<div class="bg"></div><div class="info"></div>');

  function draw(i){
    cur=i; const it=items[i];
    bg.style.backgroundImage=`url("${wide()?it.poster:it.thumb}"),url("${it.poster||it.thumb}")`;
    const saved=inList(it.src,it.slug);
    info.innerHTML=`<h2>${esc(it.name)}</h2>
      <div class="meta">${it.quality?`<span class="tag">${esc(it.quality)}</span>`:''}<span>${esc(sub(it))}</span>${it.year?`<span>• ${esc(it.year)}</span>`:''}${it.cats?`<span>• ${esc(it.cats.slice(0,4).join(', '))}</span>`:''}</div>
      <p class="clamp">${esc(it.desc||it.origin||'')}</p>
      <div class="cta"><a class="btn pri" href="#/watch/${it.src}/${encodeURIComponent(it.slug)}">${I.play} Xem ngay</a>
      <button class="btn sq ${saved?'on':''}" id="hsave" aria-label="Lưu">${saved?I.markf:I.mark}</button></div>
      <div class="dots">${items.map((_,k)=>`<button data-i="${k}" class="${k===i?'on':''}" aria-label="Phim ${k+1}"></button>`).join('')}</div>`;
    $('#hsave').onclick=()=>{toggleList(it);draw(cur)};
    $$('.dots button',info).forEach(b=>b.onclick=()=>{draw(+b.dataset.i);restart()});
  }
  draw(0);
  let tm; const restart=()=>{clearInterval(tm);tm=setInterval(()=>{ if(tok!==nav)return clearInterval(tm); draw((cur+1)%items.length)},6000);timers.push(tm)};
  restart();
  // nạp mô tả chi tiết cho các phim ở hero
  items.forEach(async(it,i)=>{
    try{ const d=await getDetail(it.slug,it.src); it.desc=d.desc; it.cats=d.cats; if(tok===nav&&cur===i){ $('.clamp',info).textContent=d.desc; } }catch{}
  });
}

function sheet(html,mount){
  const d=document.createElement('div'); d.className='sheet'; d.innerHTML=`<div class="in">${html}</div>`;
  d.onclick=e=>{ if(e.target===d||e.target.closest('[data-x]')) d.remove(); };
  document.body.appendChild(d); mount&&mount(d); return d;
}
function readAvatar(file){
  return new Promise((ok,no)=>{ const r=new FileReader();
    r.onload=()=>{ const im=new Image(); im.onload=()=>{ const n=200,c=document.createElement('canvas'); c.width=c.height=n; const m=Math.min(im.width,im.height);
        c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n); ok(c.toDataURL('image/jpeg',.85)); }; im.onerror=no; im.src=r.result; };
    r.onerror=no; r.readAsDataURL(file); });
}
function updateUser(patch){ const n=sess(), all=users(); if(!n||!all[n]) return; all[n]={...all[n],...patch}; store.set('fa_users',all); }
const keyOf=x=>x.src+'|'+x.slug;
function exportBackup(){
  const u=me(), data={app:'flix-anime',v:1,at:new Date().toISOString(),user:u?{name:u.name,display:u.display,avatar:u.avatar}:null,list:getList(),hist:getHist(),src};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download=`flix-anime-${u?u.name:'khach'}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Đã tạo file sao lưu');
}
async function importBackup(file){
  try{
    const d=JSON.parse(await file.text()); if(d.app!=='flix-anime') throw 0;
    const l=getList(), seenL=new Set(l.map(keyOf)); (d.list||[]).forEach(x=>{ if(x&&x.slug&&!seenL.has(keyOf(x))) l.push(x); });
    const h=getHist(), seenH=new Set(h.map(keyOf)); (d.hist||[]).forEach(x=>{ if(x&&x.slug&&!seenH.has(keyOf(x))) h.push(x); });
    store.set(K('list'),l); store.set(K('hist'),h.slice(0,60));
    const u=me(); if(u&&d.user){ const pt={}; if(!u.avatar&&d.user.avatar) pt.avatar=d.user.avatar; if(!u.display&&d.user.display) pt.display=d.user.display; if(Object.keys(pt).length) updateUser(pt); }
    toast(`Đã khôi phục ${(d.list||[]).length} yêu thích, ${(d.hist||[]).length} lịch sử`); return true;
  }catch{ toast('File sao lưu không hợp lệ'); return false; }
}

    <div id="tc"></div></div>
    <div class="stick"><div class="in"><a class="btn pri" href="${first}">${I.play} ${resume}</a><button class="btn sq ${saved?'on':''}" id="a3">${saved?I.markf:I.mark}</button></div></div>`);
    $('#more').onclick=()=>{const e=$('#ds');e.classList.toggle('cl');$('#more').textContent=e.classList.contains('cl')?'Chi tiết hơn':'Thu gọn';
      if(!e.classList.contains('cl')&&!$('#ex')) e.insertAdjacentHTML('afterend',`<div class="desc" id="ex" style="margin-top:10px;color:var(--m)">${d.actors?'Diễn viên: '+esc(d.actors)+'<br>':''}${d.country?'Quốc gia: '+esc(d.country)+'<br>':''}${d.total?'Số tập: '+esc(d.total)+'<br>':''}${d.status?'Trạng thái: '+esc(d.status):''}</div>`);};
    $('#a1').onclick=$('#a3').onclick=()=>{toggleList(d);draw()};
    $('#a2').onclick=async()=>{const url=location.href;try{ if(navigator.share) await navigator.share({title:d.name+' · Flix Anime',url}); else {await navigator.clipboard.writeText(url);toast('Đã sao chép liên kết');} }catch{}};
    $$('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
    const tc=$('#tc');
    if(tab==='eps'){
      if(!d.servers.length) tc.innerHTML='<p class="empty-s">Chưa có tập phim.</p>';
      else tc.innerHTML=(d.servers.length>1?`<select class="sel" id="svs">${d.servers.map((x,i)=>`<option value="${i}" ${i===si?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:'')+
        sv.eps.map((e,i)=>`<a class="lr" href="#/watch/${s}/${encodeURIComponent(d.slug)}/${si}/${i}"><div class="th"><img src="${esc(d.poster||d.thumb)}" alt=""><div class="playi"><i>${I.playf}</i></div></div><div class="tx"><b>${esc(epLabel(e.name))}</b><span>${esc(d.lang||sv.name)}</span></div></a>`).join('');
      const sel=$('#svs'); if(sel) sel.onchange=()=>{si=+sel.value;draw()};
    } else {
      tc.innerHTML=loading;
      (async()=>{ try{ const items=(await fetchList(d.cats.length&&s===src?{}:{})).filter(x=>x.slug!==d.slug); tc.innerHTML=`<div class="gr">${items.slice(0,18).map(card).join('')}</div>`; }catch{ tc.innerHTML='<p class="empty-s">Không tải được gợi ý</p>'; } })();
    }
  };
  draw();
}

/* ================= Trình phát ================= */
let hlsInst=null;
function killPlayer(){ if(hlsInst){try{hlsInst.destroy()}catch{} hlsInst=null} }
const fmt=t=>{ if(!isFinite(t)) return '0:00'; t=Math.floor(t); const h=Math.floor(t/3600),m=Math.floor(t%3600/60),x=t%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
async function vWatch(s,slug,si,ei,tok){
  killPlayer();
  setView(`<div class="bar"><a class="ib" href="javascript:history.back()">${I.back}</a><span class="sp"></span></div>${loading}`);
  let d; try{ d=await getDetail(slug,s); }catch(e){ if(tok!==nav)return; setView(`<div class="bar"><a class="ib" href="#/home">${I.back}</a><span class="sp"></span></div><p class="empty-s">Không tải được phim (${esc(e.message)}).<br>Thử đổi nguồn ở tab Tài khoản.</p>`); return; }
  if(tok!==nav) return;
  if(si==null){ const h=getHist().find(x=>x.src===s&&x.slug===d.slug); si=h?h.sv||0:0; ei=h?h.ep||0:0; }
  const sv=d.servers[si]||d.servers[0];
  if(!sv){ setView(`<div class="bar"><a class="ib" href="#/title/${s}/${encodeURIComponent(slug)}">${I.back}</a><span class="sp"></span></div><p class="empty-s">Phim chưa có tập nào.</p>`); return; }
  const idx=sv.eps[ei]?ei:0, ep=sv.eps[idx], svi=d.servers.indexOf(sv), next=sv.eps[idx+1];
  pushHist(d,svi,idx,ep.name);
  let mode=store.get('fa_mode_'+s, s==='nc'?'embed':'hls'), speed=1;
  const link=(a,b)=>`#/watch/${s}/${encodeURIComponent(d.slug)}/${a}/${b}`;
  const tlink=`#/title/${s}/${encodeURIComponent(d.slug)}`;
  const saved=()=>inList(s,d.slug);
  setView(`<div class="pbox" id="pbox"><div class="pv" id="pv"></div>
    <div class="ov show" id="ov">
      <div class="ot"><button class="ib" id="bk" aria-label="Quay lại">${I.chevD}</button><span class="sp"></span>
        ${next?`<a class="ib vo" href="${link(svi,idx+1)}" aria-label="Tập tiếp">${I.next}</a>`:''}
        <button class="ib vo" id="pip" aria-label="Thu nhỏ">${I.pip}</button><button class="ib" id="gear" aria-label="Cài đặt">${I.gear}</button><button class="ib vo" id="fs" aria-label="Toàn màn hình">${I.full}</button></div>
      <div class="oc vo"><button id="rw" aria-label="Lùi 10 giây">${I.rew}</button><button id="pp" aria-label="Phát/Tạm dừng">${I.playb}</button><button id="fw" aria-label="Tua 10 giây">${I.fwd}</button></div>
      <div class="ob vo"><div class="tm"><span id="tc">0:00</span><span id="td">0:00</span></div><input type="range" id="sk" min="0" max="1000" value="0" step="1"></div>
      <div class="menu hide" id="menu"></div>
    </div></div>
    <a class="wser" href="${tlink}">${esc(d.name)}</a>
    <h2 class="wt">${esc(epLabel(ep.name))}</h2>
    ${ep.embed||ep.m3u8?`<div class="orig">Khung phát bị đen? <a target="_blank" rel="noopener" href="${esc((ep.embed||ep.m3u8).startsWith('//')?'https:'+(ep.embed||ep.m3u8):(ep.embed||ep.m3u8))}">Mở nguồn gốc ↗</a></div>`:''}
    <div class="meta" style="padding:10px 16px 0">${d.quality?`<span class="tag">${esc(d.quality)}</span>`:''}${d.lang?`<span>• ${esc(d.lang)}</span>`:''}${d.year?`<span>• ${esc(d.year)}</span>`:''}${d.cats.length?`<span>• ${esc(d.cats.slice(0,3).join(', '))}</span>`:''}</div>
    <div class="wact"><button id="lk">${I.up}<span>Thích</span></button><button id="dk">${I.dn}</button><span class="sp"></span><button id="bm"></button><a href="${tlink}" aria-label="Chi tiết">${I.more}</a></div>
    <p class="desc cl" id="wd" style="-webkit-line-clamp:2">${esc(d.desc||'Chưa có mô tả.')}</p>
    <button class="link" id="rm">… Xem thêm</button>
    <hr class="hr">
    ${next?`<div class="ne">Tập tiếp theo</div><a class="lr" href="${link(svi,idx+1)}"><div class="th" style="width:150px"><img src="${esc(d.poster||d.thumb)}" data-alt="${esc(d.thumb)}" alt=""><div class="playi"><i>${I.playf}</i></div></div><div class="tx"><b style="font-size:16px;font-weight:400">${esc(epLabel(next.name))}</b><span>${esc(d.lang||sv.name)}</span></div></a>`:''}
    ${d.servers.length>1?`<div class="chips" style="padding-top:14px">${d.servers.map((x,i)=>`<a class="pill ${i===svi?'on':''}" href="${link(i,Math.min(idx,x.eps.length-1))}">${esc(x.name)}</a>`).join('')}</div>`:''}
    <a class="all" href="${tlink}">Tất cả các tập</a>`);
  const pbox=$('#pbox'), pv=$('#pv'), ov=$('#ov'), pp=$('#pp'), sk=$('#sk'), tc=$('#tc'), td=$('#td'), menu=$('#menu');
  let v=null, ht;
  const show=()=>{ ov.classList.add('show'); clearTimeout(ht); if(v&&!v.paused) ht=setTimeout(()=>{ menu.classList.add('hide'); ov.classList.remove('show'); },3200); };
  const drawBm=()=>{ const b=$('#bm'); b.innerHTML=saved()?I.markf:I.mark; b.classList.toggle('on',saved()); }; drawBm();
  $('#bm').onclick=()=>{toggleList(d);drawBm()};
  $('#lk').onclick=()=>{$('#lk').classList.toggle('on');$('#dk').classList.remove('on')};
  $('#dk').onclick=()=>{$('#dk').classList.toggle('on');$('#lk').classList.remove('on')};
  $('#rm').onclick=()=>{const e=$('#wd');e.classList.toggle('cl');$('#rm').textContent=e.classList.contains('cl')?'… Xem thêm':'Thu gọn'};
  $('#bk').onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); history.length>1?history.back():(location.hash='#/home'); };
  $('#fs').onclick=()=>{ const el=pbox; if(document.fullscreenElement) document.exitFullscreen(); else (el.requestFullscreen||el.webkitRequestFullscreen||(()=>v&&v.webkitEnterFullscreen&&v.webkitEnterFullscreen())).call(el); };
  $('#pip').onclick=async()=>{ try{ if(document.pictureInPictureElement) await document.exitPictureInPicture(); else await v.requestPictureInPicture(); }catch{ toast('Thiết bị không hỗ trợ thu nhỏ'); } };
  pbox.addEventListener('click',e=>{ if(e.target.closest('button,a,input,.menu')) return; menu.classList.add('hide'); ov.classList.contains('show')&&v&&!v.paused?ov.classList.remove('show'):show(); });
  $('#rw').onclick=()=>{ if(v){v.currentTime=Math.max(0,v.currentTime-10);show()} };
  $('#fw').onclick=()=>{ if(v){v.currentTime=Math.min(v.duration||1e9,v.currentTime+10);show()} };
  pp.onclick=()=>{ if(!v) return; v.paused?v.play():v.pause(); };
  sk.oninput=()=>{ if(v&&v.duration){ v.currentTime=sk.value/1000*v.duration; } sk.style.setProperty('--p',sk.value/10+'%'); show(); };
  function drawMenu(){
    menu.innerHTML=`<div class="mh">Tốc độ phát</div><div class="pl">${[.5,.75,1,1.25,1.5,2].map(x=>`<button class="pill ${x===speed?'on':''}" data-sp="${x}">${x}x</button>`).join('')}</div>
      <div class="mh">Trình phát</div><div class="pl">${ep.m3u8?`<button class="pill ${mode==='hls'&&ep.m3u8?'on':''}" data-m="hls">HLS</button>`:''}${ep.embed?`<button class="pill ${mode==='embed'||!ep.m3u8?'on':''}" data-m="embed">Nhúng</button>`:''}</div>
      ${ep.embed||ep.m3u8?`<a class="pill" style="display:inline-block" target="_blank" rel="noopener" href="${esc(ep.embed||ep.m3u8)}">Mở nguồn gốc ↗</a>`:''}`;
    $$('[data-sp]',menu).forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;if(v)v.playbackRate=speed;drawMenu()});
    $$('[data-m]',menu).forEach(b=>b.onclick=()=>{mode=b.dataset.m;store.set('fa_mode_'+s,mode);play(mode);drawMenu()});
  }
  $('#gear').onclick=()=>{ drawMenu(); menu.classList.toggle('hide'); show(); };
  function play(m){
    killPlayer(); pv.innerHTML=''; v=null; ov.classList.add('show');
    const useEmbed=()=>{ if(!ep.embed){ toast('Không có nguồn phát khả dụng'); return; } pbox.classList.add('emb'); pv.innerHTML=`<iframe src="${esc(ep.embed.startsWith('//')?'https:'+ep.embed:ep.embed)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`; };
    if(m==='embed'||!ep.m3u8){ useEmbed(); return; }
    pbox.classList.remove('emb');
    v=document.createElement('video'); v.playsInline=true; v.autoplay=true; v.setAttribute('playsinline',''); pv.appendChild(v);
    v.onplay=()=>{pp.innerHTML=I.pause;show()}; v.onpause=()=>{pp.innerHTML=I.playb;show()};
    v.onloadedmetadata=()=>{td.textContent=fmt(v.duration)};
    v.ontimeupdate=()=>{ if(!v.duration) return; tc.textContent=fmt(v.currentTime); td.textContent=fmt(v.duration); if(!sk.matches(':active')){ sk.value=v.currentTime/v.duration*1000; sk.style.setProperty('--p',sk.value/10+'%'); } };
    v.onended=()=>{ if(next) location.hash=link(svi,idx+1); };
    const fail=()=>{ toast('HLS lỗi, chuyển sang trình phát nhúng'); killPlayer(); v=null; useEmbed(); };
    if(window.Hls&&Hls.isSupported()){
      hlsInst=new Hls({maxBufferLength:30}); hlsInst.loadSource(ep.m3u8); hlsInst.attachMedia(v);
      hlsInst.on(Hls.Events.ERROR,(_,e)=>{ if(e.fatal) fail(); });
      hlsInst.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
    } else if(v.canPlayType('application/vnd.apple.mpegurl')){ v.src=ep.m3u8; v.onerror=fail; }
    else fail();
  }
  play(mode);
}

// iOS (app đã thêm vào màn hình chính) đôi khi cho vùng hiển thị ngắn hơn màn hình thật -> đo phần thiếu và kéo khung xuống cho khít
function fitScreen(){
  let gap=0;
  if(standalone()){
    const full=innerHeight>innerWidth?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
    gap=full-innerHeight; if(gap<0||gap>80) gap=0;
  }
  document.documentElement.style.setProperty('--gap',gap+'px');
}
fitScreen(); addEventListener('resize',fitScreen); addEventListener('orientationchange',()=>setTimeout(fitScreen,300));
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
route();
</script>
