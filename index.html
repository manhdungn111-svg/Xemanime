 if(a=t.closest('[data-a]'))({

  au0(){openAu(0)},au1(){openAu(1)},auM(){openAu(1-am)},auS(){auth()},out(){AU.signOut().then(()=>{toast('Đã đăng xuất');acct()})},up(){push().then(()=>toast('Đã sao lưu')).catch(()=>toast('Sao lưu thất bại'))},

  im(){$('#fi').click()},

 })[a.dataset.a]?.()};
/* ---- MangaDex ---- */
const MDX='https://api.mangadex.org',CR=['safe','suggestive'],M={};
let ML=ld('ml')||'vi',MS='followedCount',mt,MCH=[],curM='',masc=0,rc=0;
const qs=o=>Object.entries(o).flatMap(([k,v])=>Array.isArray(v)?v.map(x=>`${k}[]=${encodeURIComponent(x)}`):[`${k}=${encodeURIComponent(v)}`]).join('&');
const WP='https://phimdem-proxy.manhdungn111.workers.dev';/* dán địa chỉ Cloudflare Worker vào đây, ví dụ https://phimdem-proxy.tenban.workers.dev */
const PX=[...(WP?[u=>`${WP}?u=${encodeURIComponent(u)}`]:[]),u=>u,u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
let px=WP?0:(+ld('px')||0)%PX.length,MERR='';
async function MJ(u){MERR='';for(let k=0;k<PX.length;k++){const i=(px+k)%PX.length;try{const r=await fetch(PX[i](u));if(r.ok){px=i;sv('px',i);return await r.json()}MERR+=`[${i}] HTTP ${r.status} `}catch(e){MERR+=`[${i}] ${e.message||'lỗi mạng'} `}}throw new Error(MERR)}
const MD=(p,o)=>MJ(`${MDX}${p}?${qs(o||{})}`);
const ST={ongoing:'Đang ra',completed:'Hoàn thành',hiatus:'Tạm ngưng',cancelled:'Đã hủy'};
const MT=m=>{const a=m.attributes,f=m.relationships.find(r=>r.type=='cover_art')?.attributes?.fileName,t=a.title.en||Object.values(a.title)[0]||'?',alt=(a.altTitles||[]).map(x=>x[ML]).find(Boolean);
 return{id:m.id,name:alt||t,thumb:f?`https://uploads.mangadex.org/covers/${m.id}/${f}.256.jpg`:'',desc:a.description?.[ML]||a.description?.en||'',tags:(a.tags||[]).map(x=>x.attributes.name.en),status:ST[a.status]||a.status||'',year:a.year}};
const MC=x=>{M[x.id]=M[x.id]||x;return`<div class="c" data-md="${x.id}"><div class="im sk"><img loading="lazy" src="${E(x.thumb)}" onerror="this.remove()"></div><b>${E(x.name)}</b><i><span>${E(x.sub||[x.year,x.status].filter(Boolean).join(' • '))}</span></i></div>`};
async function mlist(p,o){const r=await MD('/manga',{limit:24,offset:(p-1)*24,includes:['cover_art'],contentRating:CR,hasAvailableChapters:'true',availableTranslatedLanguage:[ML],...o});return r.data.map(MT).map(x=>(M[x.id]=x))}
const SORTS=[['followedCount','Phổ biến'],['latestUploadedChapter','Mới cập nhật'],['rating','Đánh giá cao']];
const mchips=()=>$('#mdc').innerHTML=SORTS.map(s=>`<button class="${MS==s[0]?'on':''}" data-ms="${s[0]}">${s[1]}</button>`).join('')+[['vi','Tiếng Việt'],['en','English']].map(l=>`<button class="${ML==l[0]?'on':''}" data-ml="${l[0]}">${l[1]}</button>`).join('');
const mload=()=>{const q=$('#mdi').value.trim();G($('#mg'),p=>mlist(p,q?{title:q}:{['order['+MS+']']:'desc'}),MC)};
$('#mdi').oninput=()=>{clearTimeout(mt);mt=setTimeout(mload,450)};
function mrecent(){const xs=Object.values(S.mh).sort((a,b)=>b.at-a.at).slice(0,10);$('#mrec').innerHTML=xs.length?`<div class="sec" style="padding-top:0"><h3>Đọc gần đây</h3><div class="rw">${xs.map(h=>MC({...h.x,sub:'Chương '+(h.ch||'—')})).join('')}</div></div>`:''}
async function chapters(id){let out=[],off=0,tot=1;while(off<tot&&off<3000){const r=await MD(`/manga/${id}/feed`,{limit:500,offset:off,translatedLanguage:[ML],'order[chapter]':'asc',contentRating:CR,includeExternalUrl:0});tot=r.total;off+=500;out.push(...r.data)}
 const seen=new Set();return out.filter(c=>c.attributes.pages>0).map(c=>({id:c.id,ch:c.attributes.chapter,t:c.attributes.title})).filter(c=>{const k=c.ch??c.id;if(seen.has(k))return 0;seen.add(k);return 1})}
async function openM(id){const o=$('#md');o.classList.add('on');o.scrollTop=0;curM=id;const x0=M[id]||{};
 o.innerHTML=`<div class="tb"><button data-x="md">${I.x}</button></div><div class="ban"><img src="${E((x0.thumb||'').replace('.256.','.512.'))}"><i></i></div>${LD}`;
 try{const[d,c]=await Promise.all([MD('/manga/'+id,{includes:['cover_art']}).then(r=>MT(r.data)),chapters(id)]);M[id]=d;MCH=c;renderM()}catch{o.innerHTML+='<div class="em">Không tải được truyện này.</div>'}}
function renderM(){const x=M[curM],h=S.mh[curM],ci=h?Math.max(0,MCH.findIndex(c=>c.ch==h.ch)):0,od=MCH.map((c,i)=>i);if(!masc)od.reverse();
 $('#md').innerHTML=`<div class="tb"><button data-x="md">${I.x}</button></div><div class="ban"><img src="${E(x.thumb.replace('.256.','.512.'))}"><i></i></div>
<div class="db"><h2>${E(x.name)}</h2><div class="hm">${x.status?`<span class="chip">${E(x.status)}</span>`:''}<span>${E([x.year,x.tags.slice(0,3).join(', ')].filter(Boolean).join(' • '))}</span></div>
<p class="ds cl">${E(x.desc)||'Chưa có mô tả.'}</p><a class="more" data-a="mo">Chi tiết hơn</a>
${MCH.length?`<div class="ha" style="margin:14px 0"><button class="pri" data-mc="${ci}">${I.play}${h?'Tiếp tục đọc Chương '+E(h.ch):'Bắt đầu đọc'}</button></div>`:`<p class="em">Chưa có chương ${ML=='vi'?'tiếng Việt':'tiếng Anh'}. Hãy đổi ngôn ngữ ở trang MangaDex.</p>`}
<div class="tabs" style="padding:0"><b class="on">Chương (${MCH.length})</b><b data-a="msort" style="margin-left:auto">${masc?'Cũ → mới':'Mới → cũ'}</b></div>
${od.map(i=>{const c=MCH[i];return`<div class="ep" data-mc="${i}" style="padding:12px 0;border-bottom:1px solid #1a1a1a"><div><b>${c.ch?'Chương '+E(c.ch):'Oneshot'}</b><small>${E(c.t||'')}</small></div></div>`}).join('')}</div>`}
async function readCh(i){const c=MCH[i];if(!c)return toast(i<0?'Đây là chương đầu':'Đã hết chương');rc=i;const o=$('#mr');o.classList.add('on');o.scrollTop=0;
 const bar=`<div class="rt" id="rt"><button data-x="mr">${I.x}</button><span>${E(M[curM].name)} • ${c.ch?'Chương '+E(c.ch):'Oneshot'}</span></div>`;o.innerHTML=bar+LD;
 try{const r=await MJ(`${MDX}/at-home/server/${c.id}`);
  o.innerHTML=bar+`<div class="pg">${r.chapter.data.map(n=>`<img loading="lazy" src="${r.baseUrl}/data/${r.chapter.hash}/${n}">`).join('')}</div><div class="rn"><button data-rd="-1">← Chương trước</button><button class="nx" data-rd="1">Chương sau →</button></div>`;
  S.mh[curM]={x:{id:curM,name:M[curM].name,thumb:M[curM].thumb},ch:c.ch||'',at:Date.now()};sv('mh',S.mh);sync()}
 catch{o.innerHTML=bar+'<div class="em">Không tải được chương này.</div>'}}
/* ---- đăng nhập & sao lưu đám mây ---- */
let AU,DB,US,syt,am=0;
function merge(d){const ids=new Set(S.wl.map(x=>x.id));(d.wl||[]).forEach(x=>{if(!ids.has(x.id))S.wl.push(x)});for(const k in d.hi||{})if(!S.hi[k]||d.hi[k].at>S.hi[k].at)S.hi[k]=d.hi[k];for(const k in d.mh||{})if(!S.mh[k]||d.mh[k].at>S.mh[k].at)S.mh[k]=d.mh[k];sv('mh',S.mh);if(d.name&&S.name=='Khách')S.name=d.name;if(d.av&&!S.av)S.av=d.av;sv('wl',S.wl);sv('hi',S.hi);sv('name',S.name);sv('av',S.av);av()}
const fdoc=()=>DB.collection('phimdem').doc(US.uid);
const push=()=>US?fdoc().set({data:JSON.stringify({wl:S.wl,hi:S.hi,mh:S.mh,name:S.name,av:S.av}),at:Date.now()}):Promise.reject();
function sync(){if(!US)return;clearTimeout(syt);syt=setTimeout(()=>push().catch(()=>{}),2500)}
function openAu(m){if(!AU)return toast('Chưa bật đăng nhập: điền cấu hình Firebase');am=m;$('#at').textContent=$('#ab').textContent=m?'Đăng ký':'Đăng nhập';$('#am').textContent=m?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký';$('#ar').textContent='';$('#au').classList.add('on')}
async function auth(){const e=$('#ae').value.trim(),p=$('#apw').value;$('#ar').textContent='';$('#ab').disabled=true;
 try{am?await AU.createUserWithEmailAndPassword(e,p):await AU.signInWithEmailAndPassword(e,p);closeO('au');toast(am?'Đã tạo tài khoản':'Đã đăng nhập')}
 catch(x){$('#ar').textContent=({'auth/invalid-credential':'Sai email hoặc mật khẩu','auth/user-not-found':'Sai email hoặc mật khẩu','auth/wrong-password':'Sai email hoặc mật khẩu','auth/email-already-in-use':'Email này đã được đăng ký','auth/weak-password':'Mật khẩu cần từ 6 ký tự','auth/invalid-email':'Email không hợp lệ','auth/network-request-failed':'Không có kết nối mạng'})[x.code]||'Có lỗi xảy ra, vui lòng thử lại'}
 $('#ab').disabled=false}
if(FB.apiKey&&window.firebase){firebase.initializeApp(FB);AU=firebase.auth();DB=firebase.firestore();
 AU.onAuthStateChanged(async u=>{US=u;if(u){try{const d=await fdoc().get();if(d.exists)merge(JSON.parse(d.data().data||'{}'));await push()}catch{toast('Không đồng bộ được, kiểm tra quy tắc Firestore')}}if(cp==4)acct()})}
